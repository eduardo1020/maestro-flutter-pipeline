name: Maestro E2E Tests on Maestro Cloud

on:
  push:
    branches: [ main, poc-setup ]
  pull_request:
    branches: [ main ]

jobs:
  maestro-cloud-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ☕ Setup do Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💙 Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc' # Lê a versão do FVM
          cache: true

      - name: 📦 Instalar Dependências
        run: flutter pub get

      - name: 🏗️ Compilar APK de Debug
        run: flutter build apk --debug

      - name: 🛠️ Instalar Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: 🚀 Executar Testes no Maestro Cloud
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
        run: |
          maestro cloud \
            --apiKey "$MAESTRO_CLOUD_API_KEY" \
            --app-file build/app/outputs/flutter-apk/app-debug.apk \
            maestro/

